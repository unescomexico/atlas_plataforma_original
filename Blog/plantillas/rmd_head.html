<!-- rmd_head.html: estilo oscuro + TOC con fondo gris -->
<meta name="color-scheme" content="dark light"/>
<style>
  :root{
    --bg:#0b0d10; --card:#12161b; --text:#e9eef5; --muted:#a9b4c2; --line:#24303b;
    --accent:#7aa2ff;
  }
  body{ background: var(--bg); color: var(--text); }
  .rmd-wrap{ max-width: 1100px; margin: 0 auto; padding: 18px 24px 48px; }

  /* TOC flotante: gris oscuro + scroll */
  .tocify{
    max-height: calc(100vh - 80px) !important;
    overflow: auto !important;
    background: rgba(255,255,255,0.06) !important;  /* gris, no muy claro */
    border: 1px solid rgba(255,255,255,0.10) !important;
    border-radius: 12px !important;
    padding: 10px 10px !important;
    box-shadow: 0 10px 26px rgba(0,0,0,.25);
  }
  .tocify .list-group-item{ background: transparent !important; border:0 !important; }
  .tocify .tocify-item a{ color: var(--muted) !important; }
  .tocify .tocify-item.active > a{ color: var(--text) !important; }

  /* Encabezados */
  h1,h2,h3,h4{ color: var(--text); }
</style>
