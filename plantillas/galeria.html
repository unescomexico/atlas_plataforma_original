<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Galería de imágenes</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wrap">
    <h1>Galería de imágenes</h1>

    <div style="margin:8px 0 0;">
      <a class="btn" href="../index.html">← Volver al índice</a>
    </div>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Buscar por técnica o archivo…">
      <select id="fTecnica"><option value="">Técnica (todas)</option></select>
      <select id="fFolder"><option value="">Carpeta (todas)</option></select>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No hay resultados con esos filtros.</div>
  </div>

  <!-- Lightbox -->
  <div id="lb" class="lb" style="display:none;">
    <div class="lb_bg" id="lb_bg"></div>
    <div class="lb_panel" role="dialog" aria-modal="true">
      <button class="lb_close" id="lb_close" aria-label="Cerrar">✕</button>
      <button class="lb_nav lb_prev" id="lb_prev" aria-label="Anterior">‹</button>
      <img id="lb_img" class="lb_img" alt="">
      <button class="lb_nav lb_next" id="lb_next" aria-label="Siguiente">›</button>
      <div class="lb_footer">
        <div class="lb_counter" id="lb_counter">0 / 0</div>
        <div class="lb_caption" id="lb_caption"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
